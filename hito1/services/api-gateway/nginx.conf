upstream user_service {
    server user-service:8001;
}

upstream package_service {
    server package-service:8002;
}

upstream tracking_service {
    server tracking-service:8003;
}

server {
    listen 8000;
    server_name _;

    # ── Health del propio gateway ────────────────────────────────────────
    location /health {
        return 200 '{"service":"api-gateway","status":"up"}';
        add_header Content-Type application/json;
    }

    # ── User Service ─────────────────────────────────────────────────────
    location /users {
        proxy_pass         http://user_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /users/ {
        proxy_pass         http://user_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Package Service ──────────────────────────────────────────────────
    location /packages {
        proxy_pass         http://package_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /packages/ {
        proxy_pass         http://package_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Tracking Service ─────────────────────────────────────────────────
    location /tracking {
        proxy_pass         http://tracking_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /tracking/ {
        proxy_pass         http://tracking_service;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Manejo de errores del gateway ────────────────────────────────────
    error_page 502 503 504 /gateway_error;
    location /gateway_error {
        return 503 '{"error":"Service temporarily unavailable","code":503}';
        add_header Content-Type application/json;
    }
}
